name: Publish release

on:
  push:
    branches: [main]
    paths: [release/PUBLISH_v1.0.0, release/PUBLISH_v1.0.1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Verify repository before release
        run: python3 -I scripts/verify_repository.py
      - name: Determine version
        run: echo "VER=$(ls release/PUBLISH_v* | sed 's|release/PUBLISH_||' | sort -V | tail -1)" >> "$GITHUB_ENV"
      - name: Build release assets
        run: python3 -I scripts/build_release_assets.py dist tredoku-pattern-digit-filling \"$VER\"
      - name: Create tag and release (once per version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VER" >/dev/null 2>&1; then echo "$VER already exists; nothing to do"; exit 0; fi
          gh release create "$VER" --target "$GITHUB_SHA" --title "Version ${VER#v}" --notes-file "release/RELEASE_NOTES_${VER}.md" dist/*
          (cd dist && sha256sum * | sort -k2)
