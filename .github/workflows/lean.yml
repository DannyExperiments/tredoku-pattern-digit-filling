name: lean-core
on: [push, pull_request]
jobs:
  lean-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Build and audit axioms
        working-directory: formalization/lean
        run: |
          lean TredokuFilling.lean 2>&1 | tee build.log
          ! grep -qE '^[^:]+:[0-9]+:[0-9]+: error' build.log
          grep -q "'exists_filling' depends on axioms: \[propext, Classical.choice, Quot.sound\]" build.log
          ! grep -nE '\bsorry\b|\badmit\b|native_decide|^axiom ' TredokuFilling.lean
